<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Piano Pasti</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fafaf7;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#e2e1da;--ac:#2f7d4f;--wr:#b4472b}

:root[data-theme=dark]{--bg:#171715;--fg:#ececE6;--mut:#9a9a92;--card:#222220;--bd:#383835;--ac:#5fbf86;--wr:#e0806a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}

</style></head><body><main><h1>🍝 Piano Pasti</h1>
<nav id="nav"></nav><div id="v"></div></main><script>
const DAYS=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'],MEALS=['Pranzo','Cena'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
let S,tab='plan',ref=null,T,T2,MSG='',D={name:'',ings:[]};
function seed(){
const P=[['Pasta',500],['Riso',1000],['Passata di pomodoro',700],['Petto di pollo',600],['Uova',360],['Zucchine',500],['Patate',1000],['Tonno sgocciolato',240],['Ceci cotti',250],['Mozzarella',125],['Carote',1000],['Lenticchie cotte',240],['Parmigiano',200],['Spinaci',400],['Macinato di manzo',400]];
const R=[['Pasta al pomodoro',[[0,90],[2,100],[12,10]]],['Risotto alle zucchine',[[1,80],[5,150],[12,15]]],['Pollo e patate',[[3,150],[6,250]]],['Frittata di zucchine',[[4,120],[5,150],[12,15]]],['Pasta e ceci',[[0,70],[8,120]]],['Insalata di riso e tonno',[[1,80],[7,60],[10,50]]],['Ragù con pasta',[[0,90],[14,100],[2,100]]],['Lenticchie e carote',[[11,150],[10,100]]],['Pasta e spinaci',[[0,90],[13,150],[12,15]]]];
const s={v:4,people:2,att:{},plan:{},products:P.map((p,i)=>({id:'p'+i,name:p[0],unit:p[1],per:1,pz:false,fresh:false})),recipes:R.map((r,i)=>({id:'r'+i,serv:1,name:r[0],ings:r[1].map(x=>({p:'p'+x[0],g:x[1]}))}))};Object.assign(s.products[8],{unit:300,per:3});Object.assign(s.products[4],{unit:1,per:6,pz:true});[5,13].forEach(i=>s.products[i].fresh=true);s.recipes.forEach(r=>r.ings.forEach(i=>{if(i.p==='p4')i.g=2}));return s}
function mig(s){if(!(s.v>=2))mig2(s);if(s.v<3){s.products.forEach(p=>{if(p.fresh===undefined)p.fresh=/zucchin|spinac|insalat|melanzan|peperon|broccol|finocch|funghi|banan|aranc|fragol|\bmel[ae]\b|\bper[ae]\b/i.test(p.name)});s.v=3}if(s.v<4){s.recipes.forEach(r=>{r.serv=r.serv||2});s.v=4}return s}
function mig2(s){s.products.forEach(p=>{p.unit=p.pack;p.per=1;p.pz=false;delete p.pack;if(p.name==='Ceci cotti'&&p.unit===250){p.unit=300;p.per=3}if(p.name==='Uova'&&p.unit===360){p.unit=1;p.per=6;p.pz=true;s.recipes.forEach(r=>r.ings.forEach(i=>{if(i.p===p.id&&i.g===120)i.g=2}))}});s.v=2}
const pk=p=>p.pz?(p.per>1?p.per+' pz':'1 pz'):(p.per>1?p.per+'×'+p.unit+' g':p.unit+' g');
const pp=(d,m)=>S.att[d+'-'+m]??S.people;
const slots=()=>{const a=[];for(let d=0;d<7;d++)for(let m=0;m<2;m++)if(pp(d,m)>0)a.push(d+'-'+m);return a};
function calc(pl){const L={},u={};for(const k of slots()){const[d,m]=k.split('-'),pe=pp(d,m),r=S.recipes.find(x=>x.id===pl[k]);if(!r)continue;for(const i of r.ings){(L[i.p]=L[i.p]||[]).push([+d,i.g*pe/(r.serv||2)]);const o=u[i.p]=u[i.p]||{};o[r.name]=(o[r.name]||0)+1}}
const rows=[],late=[],exp=[];let waste=0,fresh=0;
for(const p of S.products){const l=L[p.id];if(!l)continue;let units=0,open=0,od=0,g=0,ex=0;
for(const[d,a0]of l){let a=a0;g+=a;if(open>p.unit*.05&&d-od>3)ex=1;if(d-od>3)open=0;const t=Math.min(open,a);open-=t;a-=t;while(a>1e-9){units++;od=d;open=p.unit;const t2=Math.min(open,a);open-=t2;a-=t2}}
if(open>p.unit*.05&&od+3<=6)ex=1;
const packs=Math.ceil(units/p.per),left=Math.max(0,units*p.unit-g),spare=packs*p.per-units;waste+=left/p.unit;
if(ex){exp.push(p.name);waste+=.5}
if(p.fresh){if(l.some(x=>x[0]>2))late.push(p.name);for(const[d]of l)fresh+=d>2?5:.3*d}
rows.push({p,g,units,packs,left,spare,use:Object.entries(u[p.id]).map(([x,c])=>esc(x)+(c>1?' ×'+c:'')).join(', ')})}
return{rows,waste,fresh,late,exp}}
function warns(c){const w=[],n={};for(const k of slots()){const r=S.plan[k];if(r)n[r]=(n[r]||0)+1}
for(const id in n)if(n[id]>2)w.push(((S.recipes.find(r=>r.id===id)||{}).name||'?')+' compare '+n[id]+' volte (max 2). Servono più ricette.');
if(c.late.length)w.push('Frutta/verdura usata dopo mercoledì: '+c.late.join(', '));
if(c.exp.length)w.push('Aperti e non finiti entro 3 giorni: '+c.exp.join(', '));return w}
function sc(pl){const c={};let a=0,prev;for(const k of slots()){const r=pl[k];c[r]=(c[r]||0)+1;if(r===prev)a++;prev=r}
const v=Object.values(c),x=calc(pl);return x.waste*10+x.fresh+.1*v.reduce((s,n)=>s+n*n,0)+50*v.reduce((s,n)=>s+Math.max(0,n-2),0)+a}
function gen(){const ks=slots(),R=S.recipes;if(!ks.length||!R.length)return;const rnd=()=>R[Math.random()*R.length|0].id;let gb=null,gs=1e9;
for(let r=0;r<8;r++){const pl={};ks.forEach(k=>pl[k]=rnd());let cur=sc(pl);
for(let i=0;i<3000;i++){const t=2*(1-i/3000)+.01,a=ks[Math.random()*ks.length|0],b=Math.random()<.3?ks[Math.random()*ks.length|0]:a,oa=pl[a],ob=pl[b];
pl[a]=rnd();if(b!==a)pl[b]=rnd();const s=sc(pl);
if(s<=cur||Math.random()<Math.exp((cur-s)/t)){cur=s;if(s<gs){gs=s;gb={...pl}}}else{pl[a]=oa;pl[b]=ob}}}
S.plan=gb;save();render()}
function save(){clearTimeout(T);T=setTimeout(async()=>{try{if(ref)await ref.set(S);else localStorage.setItem('pp',JSON.stringify(S))}catch(e){}},400);if(GH.token&&GH.repo){clearTimeout(T2);T2=setTimeout(()=>ghSave(),4000)}}
function setAtt(k,v){S.att[k]=Math.max(0,+v||0);save();render()}
function vPlan(){const c=calc(S.plan),W=warns(c);
let h=`<div class=row><label>Persone di base <input type=number min=1 class=n value=${S.people} onchange="S.people=Math.max(1,+this.value||1);save();render()"></label><button class=pri onclick="gen()">Genera piano</button></div><p class=mut>Metti 0 per togliere un pasto. Un numero più basso se manca qualcuno. Regole: max 2 volte lo stesso piatto, frutta/verdura a inizio settimana, prodotti aperti finiti entro 3 giorni.</p><div class=sc><table><tr><th></th>${MEALS.map(m=>`<th>${m}</th>`).join('')}</tr>`;
for(let d=0;d<7;d++){h+=`<tr><th>${DAYS[d]}</th>`;for(let m=0;m<2;m++){const k=d+'-'+m,pe=pp(d,m);
h+=`<td class="${pe?'':'off'}"><input type=number min=0 class=n value=${pe} onchange="setAtt('${k}',this.value)"> <span class=mut>pers.</span>`+(pe?`<select onchange="S.plan['${k}']=this.value;save();render()"><option value="">—</option>${S.recipes.map(r=>`<option value="${r.id}" ${S.plan[k]===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`:`<div class=mut>saltato</div>`)+'</td>'}h+='</tr>'}
h+='</table></div>'+(W.length?`<div class=card style="border-color:var(--wr);color:var(--wr)">${W.map(esc).join('<br>')}</div>`:'')+'<h2>Lista della spesa</h2>';
if(!c.rows.length)return h+'<p class=mut>Genera un piano per vedere cosa comprare.</p>';
h+='<div class=sc><table><tr><th>Prodotto</th><th>Serve</th><th>Da comprare</th><th>Avanzo</th><th>Usato in</th></tr>';
for(const r of c.rows){const U=r.p.pz?'pz':'g',ok=r.left<=r.p.unit*.05+1e-9;h+=`<tr><td>${esc(r.p.name)}</td><td>${+r.g.toFixed(1)} ${U}</td><td>${r.packs} conf. <span class=mut>(${pk(r.p)})</span>${r.spare?`<div class=mut>in dispensa: ${r.spare} ${r.p.pz?'pz':'unità chiuse'}</div>`:''}</td><td style="color:${ok?'var(--ac)':r.left>r.p.unit*.25?'var(--wr)':'inherit'}">${ok?'✓ tutto usato':+r.left.toFixed(1)+' '+U}</td><td class=mut>${r.use}</td></tr>`}
return h+`</table></div><p class=mut>Avanzo aperto totale: ${Math.round(c.rows.reduce((s,r)=>s+(r.p.pz?0:r.left),0))} g</p>`}
function vRec(){const pr=id=>S.products.find(p=>p.id===id)||{name:'?'};
let h=S.recipes.map(r=>`<div class=card><div class=row><b>${esc(r.name)}</b><span><button onclick="editRec('${r.id}')">✎</button> <button class=x onclick="S.recipes=S.recipes.filter(x=>x.id!=='${r.id}');save();render()">✕</button></span></div><div class=mut>${r.ings.map(i=>`${esc(pr(i.p).name)} ${i.g} ${pr(i.p).pz?'pz':'g'}`).join(' · ')} — per ${r.serv||2} persone</div></div>`).join('');
h+=`<h2 id=rf>${D.id?'Modifica ricetta':'Nuova ricetta'}</h2><div class=card><input class=w style="width:100%" placeholder="Nome ricetta" value="${esc(D.name)}" oninput="D.name=this.value"><div class=row style="margin-top:6px;justify-content:flex-start"><label>Quantità per <input type=number class=n min=1 value=${D.serv||2} onchange="D.serv=Math.max(1,+this.value||2)"> persone</label></div>`;
D.ings.forEach((x,i)=>{h+=`<div class=row style="margin-top:6px"><select class=w onchange="D.ings[${i}].p=this.value;render()">${S.products.map(p=>`<option value="${p.id}" ${p.id===x.p?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input type=number class=n min=0 step=any value=${x.g} onchange="D.ings[${i}].g=+this.value"> ${pr(x.p).pz?'pz':'g'}<button class=x onclick="D.ings.splice(${i},1);render()">✕</button></div>`});
return h+`<div class=row style="margin-top:8px"><button onclick="if(S.products.length){D.ings.push({p:S.products[0].id,g:S.products[0].pz?1:100});render()}">+ ingrediente</button><button class=pri onclick="addRec()">Salva</button>${D.id?'<button onclick="D={name:\'\',ings:[]};render()">Annulla</button>':''}</div></div><h2>Aggiungi in blocco</h2><div class=card><p class=mut>Una ricetta per blocco, separati da una riga vuota. Prima riga: nome, con le persone tra parentesi se non sono 2 (es. «Lasagne (4)»). Poi «ingrediente quantità» per quelle persone, ad esempio «uova 2 pz». Gli ingredienti nuovi vengono creati.</p><textarea id=bulkr rows=6 style="width:100%" placeholder="Pasta al pomodoro&#10;pasta 90&#10;passata 100"></textarea><div class=row><button class=pri onclick="bulkR()">Importa ricette</button></div></div>`}
function addRec(){const ings=D.ings.filter(i=>i.p&&i.g>0);if(!D.name.trim()||!ings.length)return;if(D.id){const r=S.recipes.find(x=>x.id===D.id);if(r){r.name=D.name.trim();r.ings=ings;r.serv=D.serv||2}}else S.recipes.push({id:uid(),name:D.name.trim(),ings,serv:D.serv||2});D={name:'',ings:[]};save();render()}
function editRec(id){const r=S.recipes.find(x=>x.id===id);D={id,serv:r.serv||2,name:r.name,ings:JSON.parse(JSON.stringify(r.ings))};render();$('rf').scrollIntoView()}
function vProd(){let h='<p class=mut>Unità = il pezzo singolo sigillato (barattolo, uovo, pacco). "Unità per confezione" = quante ne contiene il multipack. Solo l\'unità aperta può generare spreco: le altre restano chiuse in dispensa.</p>';
h+=S.products.map((p,i)=>`<div class=card><div class=row><input class=w value="${esc(p.name)}" onchange="S.products[${i}].name=this.value;save()"><button class=x onclick="delP('${p.id}')">✕</button></div><div class=row style="margin-top:6px;justify-content:flex-start"><select onchange="setMode(${i},this.value)"><option value=g ${p.pz?'':'selected'}>a peso (g)</option><option value=pz ${p.pz?'selected':''}>a pezzi</option></select>${p.pz?'':`<label><input type=number class=n min=1 value=${p.unit} onchange="S.products[${i}].unit=Math.max(1,+this.value||1);save()"> g per unità</label>`}<label><input type=number class=n min=1 value=${p.per} onchange="S.products[${i}].per=Math.max(1,+this.value||1);save()"> unità per confezione</label><label><input type=checkbox ${p.fresh?'checked':''} onchange="S.products[${i}].fresh=this.checked;save()"> frutta/verdura</label></div></div>`).join('');
return h+`<h2>Nuovo prodotto</h2><div class=card><div class=row><input class=w id=pn placeholder="Nome"><select id=pm><option value=g>a peso (g)</option><option value=pz>a pezzi</option></select></div><div class=row style="margin-top:6px;justify-content:flex-start"><input type=number class=n id=pk placeholder="g" min=1><span class=mut>g per unità</span><input type=number class=n id=pc min=1 value=1><span class=mut>unità per confezione</span><label><input type=checkbox id=pf> frutta/verdura</label><button class=pri onclick="addP()">Aggiungi</button></div></div><h2>Aggiungi o modifica in blocco</h2><div class=card><p class=mut>Una riga per prodotto: nome, g per unità (o «pz»), unità per confezione. Esempi: «Ceci, 300, 3» · «Uova, pz, 6» · «Pasta, 500» · «Zucchine, 500, 1, fresco». Se il nome esiste, lo aggiorna.</p><textarea id=bulkp rows=5 style="width:100%"></textarea><div class=row><button class=pri onclick="bulkP()">Importa prodotti</button></div></div>`}
function setMode(i,v){const p=S.products[i];p.pz=v==='pz';p.unit=p.pz?1:(p.unit>1?p.unit:100);save();render()}
function addP(){const n=$('pn').value.trim(),pz=$('pm').value==='pz',g=pz?1:+$('pk').value;if(!n||g<1)return;S.products.push({id:uid(),name:n,unit:g,per:Math.max(1,+$('pc').value||1),pz,fresh:$('pf').checked});save();render()}
function delP(id){S.products=S.products.filter(p=>p.id!==id);S.recipes.forEach(r=>r.ings=r.ings.filter(i=>i.p!==id));D.ings=D.ings.filter(i=>i.p!==id);save();render()}
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
function findP(n){const q=norm(n);return S.products.find(p=>norm(p.name)===q)||S.products.filter(p=>{const x=norm(p.name);return x.includes(q)||q.includes(x)}).sort((a,b)=>b.name.length-a.name.length)[0]}
function bulkP(){let c=0;$('bulkp').value.split('\n').forEach(l=>{const a=l.split(/[;,]/).map(x=>x.trim());if(!a[0])return;const pz=/^pz|pezz/i.test(a[1]||''),u=pz?1:(+a[1]||500),per=Math.max(1,+a[2]||1),fresh=/^f|frut|verd/i.test(a[3]||''),o=S.products.find(p=>norm(p.name)===norm(a[0]));if(o)Object.assign(o,{unit:u,per,pz,fresh});else S.products.push({id:uid(),name:a[0],unit:u,per,pz,fresh});c++});MSG=c+' prodotti importati';save();render()}
function bulkR(){let nr=0;const np=[];for(const b of $('bulkr').value.split(/\n\s*\n/)){const ls=b.split('\n').map(x=>x.trim()).filter(Boolean),ings=[];if(ls.length<2)continue;
for(const l of ls.slice(1)){const m=l.match(/^(.*?)[\s:;,]+(\d+(?:[.,]\d+)?)\s*(g|gr|pz|pezzi)?\.?$/i);if(!m)continue;let p=findP(m[1]);if(!p){const pz=/^pz|pezzi/i.test(m[3]||'');p={id:uid(),name:m[1].trim(),unit:pz?1:500,per:1,pz};S.products.push(p);np.push(p.name)}ings.push({p:p.id,g:+m[2].replace(',','.')})}
if(!ings.length)continue;const hm=ls[0].match(/^(.*?)\s*[(\[]\s*(\d+)\s*(?:pers\w*|p)?\s*[)\]]$/i),nm=hm?hm[1]:ls[0],sv=hm?+hm[2]:2,o=S.recipes.find(r=>norm(r.name)===norm(nm));if(o){o.ings=ings;o.serv=sv}else S.recipes.push({id:uid(),name:nm,ings,serv:sv});nr++}
MSG=nr+' ricette importate'+(np.length?'. Prodotti nuovi da controllare (peso confezione 500 g di default): '+np.join(', '):'');save();render()}
let GH=(()=>{try{return JSON.parse(localStorage.getItem('ppgh'))||{}}catch(e){return{}}})(),ghSha=null,GST='';
const ghU=()=>`https://api.github.com/repos/${GH.repo}/contents/${GH.path||'data.json'}?ref=${GH.branch||'main'}`,ghH=()=>({Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json'});
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/\n/g,'')))),b64e=t=>btoa(unescape(encodeURIComponent(t)));
async function ghLoad(){try{const r=await fetch(ghU(),{headers:ghH()});if(r.status===404){ghSha=null;GST='File non ancora presente: verrà creato al primo salvataggio.';return false}if(!r.ok)throw r.status;const j=await r.json();ghSha=j.sha;S=mig(JSON.parse(b64d(j.content)));try{localStorage.setItem('pp',JSON.stringify(S))}catch(e){}GST='Caricato da GitHub';return true}catch(e){GST='Errore GitHub: '+e;return false}}
async function ghSave(retry){try{const body={message:'Aggiorna dati',content:b64e(JSON.stringify(S,null,1)),branch:GH.branch||'main'};if(ghSha)body.sha=ghSha;
const r=await fetch(ghU().split('?')[0],{method:'PUT',headers:ghH(),body:JSON.stringify(body)});
if((r.status===409||r.status===422)&&!retry){const g=await fetch(ghU(),{headers:ghH()});ghSha=g.ok?(await g.json()).sha:null;return ghSave(1)}
if(!r.ok)throw r.status;ghSha=(await r.json()).content.sha;GST='Salvato su GitHub alle '+new Date().toLocaleTimeString()}catch(e){GST='Errore salvataggio: '+e}if(tab==='dat')render()}
function ghConf(k,v){GH[k]=v;try{localStorage.setItem('ppgh',JSON.stringify(GH))}catch(e){}}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='data.json';a.click()}
function imp(){try{const d=mig(JSON.parse($('im').value));if(!d.products||!d.recipes)throw 0;d.att=d.att||{};d.plan=d.plan||{};d.people=d.people||2;S=d;save();MSG='Dati importati';tab='plan'}catch(e){MSG='JSON non valido'}render()}
function vDat(){const I=(k,ph,t)=>`<input class=w ${t?'type=password ':''}placeholder="${ph}" value="${esc(GH[k]||'')}" onchange="ghConf('${k}',this.value.trim())">`;
return `<h2>Esporta</h2><textarea id=ex readonly rows=6 style="width:100%">${esc(JSON.stringify(S,null,1))}</textarea><div class=row><button onclick="$('ex').select();document.execCommand('copy')">Copia</button><button onclick="dl()">Scarica data.json</button></div><h2>Importa</h2><textarea id=im rows=4 style="width:100%" placeholder="Incolla qui il JSON"></textarea><div class=row><button onclick="imp()">Importa (sostituisce tutto)</button></div><h2>GitHub</h2><p class=mut>Salva i dati in un file del repository (funziona solo sul sito GitHub Pages). Usa un token fine-grained limitato a quel repository, con permesso Contents in lettura e scrittura. Il token resta solo in questo browser. Con il token impostato, ogni modifica viene salvata dopo 4 secondi.</p><div class=card><div class=row>${I('repo','utente/repo')}${I('branch','main')}${I('path','data.json')}</div><div class=row style="margin-top:6px">${I('token','token',1)}</div><div class=row style="margin-top:6px;justify-content:flex-start"><button onclick="ghLoad().then(()=>render())">Carica da GitHub</button><button class=pri onclick="ghSave()">Salva ora</button></div></div><p class=mut>${esc(GST)}</p>`}
const $=id=>document.getElementById(id);
function render(){$('nav').innerHTML=[['plan','Piano'],['rec','Ricette'],['prod','Prodotti'],['dat','Dati']].map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
$('v').innerHTML=(MSG?`<p style="color:var(--ac)">${esc(MSG)}</p>`:'')+(tab==='plan'?vPlan():tab==='rec'?vRec():tab==='prod'?vProd():vDat());MSG=''}
(async()=>{try{S=mig(JSON.parse(localStorage.getItem('pp')))}catch(e){S=null}const had=!!S;S=S||seed();render();
try{if(window.claude){const db=await claude.use('db');if(db){ref=db.doc('app/state');const s=await ref.get();if(s.exists){const d=JSON.parse(JSON.stringify(s.data()));S=mig(d);if(d.v!==s.data().v)save()}else await ref.set(S);render()}}}catch(e){ref=null}
if(GH.token&&GH.repo){if(await ghLoad())render()}else if(!had&&!ref){try{const r=await fetch('data.json');if(r.ok){S=mig(await r.json());render()}}catch(e){}}})();
</script></body></html>
